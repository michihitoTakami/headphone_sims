# 40 mm driver behind a hex-perforated grille, parametric pinna, paired
# with an automatic no-filter reference run for diffraction-artifact metrics.
name: hex_filter_40mm
device: null # auto: cuda if available
compare_without_filters: true
scene:
  dx: 0.5e-3
  distance: 25.0e-3 # parametric pinna protrudes 18mm toward the driver
  record_ms: 2.0
  snapshot_every: 40
  driver:
    diameter: 40.0e-3
    tilt_deg: 0.0
  filters:
    - kind: hex
      hole_radius: 0.5e-3
      pitch: 2.0e-3
      thickness: 1.0e-3
      standoff: 3.0e-3
  pinna:
    kind: parametric
