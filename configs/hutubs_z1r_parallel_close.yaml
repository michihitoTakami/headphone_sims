# Design E — 70mm driver with an MDR-Z1R-inspired Fibonacci spiral grille:
# 8 + 13 crossing logarithmic-spiral ribs (1.2mm wide, winding 1.2), sealed.
# Non-periodic cell spacing, ~70% open. Compare against design D (periodic hex).
name: hutubs_z1r_parallel_close
device: null
compare_without_filters: true
scene:
  dx: 0.5e-3
  distance: 10.0e-3
  record_ms: 2.5
  snapshot_every: 40
  driver:
    diameter: 70.0e-3
    tilt_deg: -15.0
  filters:
    - kind: fib
      radius: 35.0e-3
      rib_width: 1.2e-3
      spirals_cw: 8
      spirals_ccw: 13
      winding: 1.2
      thickness: 0.5e-3
      standoff: 1.5e-3
  pinna:
    kind: mesh
    mesh_path: data/hutubs/pp1_3DheadMesh.ply
    side: left
