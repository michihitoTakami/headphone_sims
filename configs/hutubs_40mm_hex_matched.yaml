# 40 mm driver with a same-size (radius 20 mm) hex-perforated grille in front,
# real HUTUBS subject-1 pinna. Paired with an automatic no-filter reference to
# quantify what the grille actually does to the wavefront at the pinna.
name: hutubs_40mm_hex_matched
device: null
compare_without_filters: true
scene:
  dx: 0.5e-3
  distance: 15.0e-3
  record_ms: 2.5
  snapshot_every: 40
  driver:
    diameter: 40.0e-3
    tilt_deg: 0.0
  filters:
    - kind: hex
      radius: 20.0e-3 # same size as the driver
      hole_radius: 0.5e-3
      pitch: 2.0e-3
      thickness: 1.0e-3
      standoff: 3.0e-3
  pinna:
    kind: mesh
    mesh_path: data/hutubs/pp1_3DheadMesh.ply
    side: left
