# MDR-Z1R model v2 (corrected to the official cross-section): 30mm central
# magnesium dome (apex 6mm) + 20mm-wide rounded donut LCP edge (crest ~4.5mm),
# tapered drive; FLAT Fibonacci protector (the real one is flat) at 8.5mm.
# Placement: minimum physical distance (grille front + 2mm), i.e. ~29mm from
# the head surface — within a realistic pad depth.
name: hutubs_70mm_z1r_v2
device: null
compare_without_filters: true
scene:
  dx: 0.5e-3
  distance: 11.0e-3
  record_ms: 2.5
  snapshot_every: 0
  driver:
    diameter: 70.0e-3
    tilt_deg: 0.0
    shape: dome
    dome_fraction: 0.43
    dome_depth: 6.0e-3
    edge_height: 3.0e-3
    surround: roll
    edge_roll_height: 3.0e-3
  filters:
    - kind: fib
      radius: 35.0e-3
      rib_width: 1.2e-3
      spirals_cw: 8
      spirals_ccw: 13
      winding: 1.2
      thickness: 0.5e-3
      standoff: 8.5e-3
  pinna:
    kind: mesh
    mesh_path: data/hutubs/pp1_3DheadMesh.ply
    side: left
