# Design D — 70mm driver with a matched 70mm transparent grille (same hole
# spec as design B; the Helmholtz frequency is independent of grille diameter).
# Domain and probe layout are identical to design B, so B vs D compares the
# driver size directly.
name: hutubs_70mm_grille_optimized
device: null
compare_without_filters: true
scene:
  dx: 0.5e-3
  distance: 15.0e-3
  record_ms: 2.5
  snapshot_every: 40
  driver:
    diameter: 70.0e-3
    tilt_deg: 0.0
  filters:
    - kind: hex
      radius: 35.0e-3
      hole_radius: 1.0e-3
      pitch: 2.6e-3
      thickness: 0.5e-3
      standoff: 1.5e-3
  pinna:
    kind: mesh
    mesh_path: data/hutubs/pp1_3DheadMesh.ply
    side: left
