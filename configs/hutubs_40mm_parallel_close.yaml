# Design B — acoustically transparent matched grille (40mm driver, 40mm grille).
# High porosity (54%), thin plate, shallow sealed cavity: Helmholtz resonance
# predicted at 24.1 kHz (out of band); the uniform 40mm piston drive does not
# excite the cavity's radial mode.
name: hutubs_40mm_parallel_close
device: null
compare_without_filters: true
scene:
  dx: 0.5e-3
  distance: 10.0e-3
  record_ms: 2.5
  snapshot_every: 40
  driver:
    diameter: 40.0e-3
    tilt_deg: -15.0
  filters:
    - kind: hex
      radius: 20.0e-3
      hole_radius: 1.0e-3
      pitch: 2.6e-3
      thickness: 0.5e-3
      standoff: 1.5e-3
  pinna:
    kind: mesh
    mesh_path: data/hutubs/pp1_3DheadMesh.ply
    side: left
