# LCD model v2 (photo-measured): ~11 slots across the 90mm axis, 32% open
# (pitch 8.2mm -> 11 slots/90mm, bars 5.6mm running along the 65mm width),
# 10mm total structure = 5mm rectangular magnet + 5mm Fazor taper
# (gap flares 2.6mm -> 6.6mm at the exit, bar tops 1.6mm). Diaphragm-magnet gap 1mm.
# Placement: minimum physical distance (structure front + 2mm) ~31mm from head.
name: hutubs_90mm_planar_v2
device: null
compare_without_filters: true
scene:
  dx: 0.5e-3
  distance: 13.0e-3
  record_ms: 2.5
  snapshot_every: 0
  driver:
    shape: rect
    width: 65.0e-3
    height: 90.0e-3
    tilt_deg: 0.0
  filters:
    - kind: slots
      shape: rect
      width: 65.0e-3
      height: 90.0e-3
      slot_width: 2.6e-3
      pitch: 8.2e-3
      pattern_angle_deg: 0.0
      thickness: 10.0e-3
      standoff: 6.0e-3
      chamfer_depth: 2.0e-3
      chamfer_fraction: 0.5
  pinna:
    kind: mesh
    mesh_path: data/hutubs/pp1_3DheadMesh.ply
    side: left
